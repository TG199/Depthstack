<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0%" stop-color="#FFC300"></stop>
      <stop offset="100%" stop-color="#FF8C00"></stop>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0" y1="256" x2="256" y2="0">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#cccccc"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="#000000"></rect>

  <!-- Top Layer -->
  <polygon points="128,30 220,80 128,130 36,80" stroke="url(#grad)" stroke-width="2" fill="none"></polygon>

  <!-- Middle Layer -->
  <polygon points="128,70 200,110 128,150 56,110" stroke="url(#grad)" stroke-width="2" fill="none"></polygon>

  <!-- Inner Layer -->
  <polygon points="128,100 180,130 128,160 76,130" stroke="url(#grad)" stroke-width="2" fill="none"></polygon>

  <!-- Bottom Layer -->
  <polygon points="128,140 200,180 128,220 56,180" stroke="url(#whiteGrad)" stroke-width="2" fill="none"></polygon>

  <!-- Vertical lines -->
  <line x1="128" y1="30" x2="128" y2="220" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"></line>

  <!-- Accent cross lines -->
  <line x1="60" y1="150" x2="196" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.7"></line>
  <line x1="60" y1="100" x2="196" y2="150" stroke="#FFC300" stroke-width="1" opacity="0.7"></line>
</svg>